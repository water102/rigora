<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rigora · Compatibility Lab</title>
  </head>
  <body>
    <main>
      <header>
        <p>RIGORA / COMPATIBILITY LAB</p>
        <h1>One pose. Two formats.</h1>
        <p>Setup-pose preview · synthetic fixture · WebGL</p>
      </header>
      <nav>
        <label
          >Source
          <select id="source">
            <option value="spine">Spine 3.8.75</option>
            <option value="dragonbones">DragonBones 5.5</option>
            <option value="mesh">Canonical Weighted Mesh</option>
            <option value="worker">Auto-Mesh Worker (BBW/Laplacian)</option>
            <option value="animated">Animated Mesh Playback</option>
            <option value="ik">Canonical IK & Constraints</option>
            <option value="path">Canonical Path Constraint</option>
          </select></label
        ><label><input id="debug" type="checkbox" checked /> Debug bones</label
        ><button id="snapshot">Download pose JSON</button>
        <span
          id="playback-controls"
          style="
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
          "
        >
          <button id="brush-undo" type="button">Undo brush</button>
          <button id="brush-redo" type="button">Redo brush</button>
          <button id="authoring-save" type="button">Save authoring</button>
          <button id="authoring-load" type="button">Load authoring</button>
          <label
            >Attachment
            <select id="attachment-kind">
              <option value="region">Region</option>
              <option value="mesh">Mesh</option>
              <option value="clipping">Clipping</option>
              <option value="path">Path</option>
              <option value="boundingBox">Bounding box</option>
            </select></label
          >
          <button id="create-attachment" type="button">
            Create attachment
          </button>
          <label
            >Bone
            <select id="binding-bone">
              <option value="bone-1">bone-1</option>
              <option value="bone-2">bone-2</option>
            </select></label
          >
          <button id="bind-demo" type="button">Bind selected</button>
          <button id="unbind-demo" type="button">Unbind selected</button>
          <button id="play-btn" type="button">Play</button>
          <input
            id="time-slider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0"
            style="width: 140px"
          />
          <span
            id="time-display"
            style="font-family: monospace; font-size: 12px; min-width: 48px"
            >0.00s</span
          >
          <label><input id="loop" type="checkbox" checked /> Loop</label>
        </span>
        <label
          >Alpha
          <input
            id="auto-threshold"
            type="number"
            min="0"
            max="255"
            value="128"
        /></label>
        <button id="auto-preview" type="button">Preview alpha mesh</button>
        <button id="auto-apply" type="button">Apply alpha mesh</button>
        <button id="auto-cancel" type="button">Cancel preview</button>
        <label
          >Weight exponent
          <input
            id="auto-weight-power"
            type="number"
            min="0.1"
            step="0.1"
            value="2"
        /></label>
        <label
          >Max influences
          <input
            id="auto-weight-max"
            type="number"
            min="1"
            max="8"
            step="1"
            value="4"
        /></label>
        <button id="auto-weight-preview" type="button">
          Preview auto weights
        </button>
        <label
          >Brush
          <select id="brush-mode">
            <option value="add">Add</option>
            <option value="subtract">Subtract</option>
            <option value="smooth">Smooth</option>
            <option value="erase">Erase</option>
          </select></label
        >
        <input
          id="brush-strength"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.25"
        />
        <button id="paint-demo" type="button">Paint demo weights</button>
        <button id="heatmap-demo" type="button">Show heatmap</button>
        <button id="topology-demo" type="button">Topology reset</button>
        <button id="deform-demo" type="button">Preview deform key</button>
        <label
          >Canvas mode
          <select id="canvas-mode">
            <option value="vertex">Vertex drag</option>
            <option value="lasso">Lasso select</option>
            <option value="select-edge">Edge select</option>
            <option value="select-face">Face select</option>
            <option value="select-boundary">Boundary select</option>
            <option value="brush">Weight brush</option>
            <option value="deform">Deform authoring</option>
            <option value="path">Path control points</option>
          </select></label
        >
      </nav>
      <section id="stage" aria-label="Skeleton preview"></section>
      <pre id="status" role="status">Initializing renderer…</pre>
      <footer>
        Setup poses only. Animation import and full compatibility verification
        are not available yet.
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
