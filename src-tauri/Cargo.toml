[package]
name = "rigora"
version = "0.1.0"
description = "Rigora native desktop application"
authors = ["Rigora"]
edition = "2021"

[lib]
name = "rigora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
